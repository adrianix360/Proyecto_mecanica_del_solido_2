     Creada por Adrián Castro Ramírez, Escuela de Ingeniería Civil, Universidad de Costa Rica. Versión v02 · noviembre 2026.
     Hecha con ayuda de Claude (Anthropic). © 2026 Adrián Castro Ramírez. Todos los derechos reservados. -->
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Distribución: cabecera con fases · panel de paso (izquierda) + visor 3D (derecha) · barra inferior Anterior/Siguiente.
   En pantalla angosta el visor va arriba y el panel debajo. */
:root{
  --bg:#EAF0F6; --panel:#FFFFFF; --ink:#132033; --muted:#55657A; --line:#C8D3E0;
  --callout:#D3EBFB; --callout-ink:#0D3554; --sub:#FBE6BE; --sub-ink:#4A3305;
  --accent:#FFC20E; --accent-ink:#1B1400; --warn:#C8102E; --warn-bg:#FDE3E6; --ok:#17803A; --ok-bg:#DDF3E4;
  --view:#DCE5EF; --chip:#F1F5F9; --shadow:0 1px 0 rgba(19,32,51,.06),0 6px 18px rgba(19,32,51,.08);
  --f-disp:"Archivo Black","Arial Black",Impact,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --c-CS:#D01012; --c-PE:#F57D20; --c-DWT:#0055BF; --c-DWB:#5A93DB; --c-CI:#00852B; --c-GI:#FFCD03; --c-GS:#FFCD03;
  --c-VP:#8E44AD; --c-PS:#E0479E; --c-TS:#A5CA18; --c-TP:#A5CA18; --c-GT:#00A3B4;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D131C; --panel:#151E2B; --ink:#E6EDF5; --muted:#93A3B7; --line:#2A3748;
  --callout:#123049; --callout-ink:#CDE8FF; --sub:#3A2C12; --sub-ink:#FBE6BE;
  --accent:#FFC20E; --accent-ink:#1B1400; --warn:#FF5C70; --warn-bg:#3A1219; --ok:#45D07A; --ok-bg:#12321F;
  --view:#1A2433; --chip:#1E2938; --shadow:0 1px 0 rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D131C; --panel:#151E2B; --ink:#E6EDF5; --muted:#93A3B7; --line:#2A3748;
  --callout:#123049; --callout-ink:#CDE8FF; --sub:#3A2C12; --sub-ink:#FBE6BE;
  --accent:#FFC20E; --accent-ink:#1B1400; --warn:#FF5C70; --warn-bg:#3A1219; --ok:#45D07A; --ok-bg:#12321F;
  --view:#1A2433; --chip:#1E2938; --shadow:0 1px 0 rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:18px/1.45 var(--f-body);margin:0;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto auto}
/* autoría: línea de pie en todas las pantallas */
.credito{background:var(--panel);border-top:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.4;text-align:center;
  padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.credito .lnk{background:none;border:0;padding:4px 2px;margin:-4px 0;color:var(--ink);font:inherit;font-weight:700;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.app:has(.navb:not([hidden])) .navb{padding-bottom:10px}
.card.acerca{display:grid;gap:8px;border-left:6px solid var(--accent)}
.acerca p{margin:0}
.acerca .firma{font:20px/1.2 var(--f-disp)}
/* cabecera */
.top{display:flex;align-items:center;gap:12px;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.brand b{font:22px/1 var(--f-disp);letter-spacing:.01em}
.brand small{display:block;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.fases{display:flex;gap:6px;overflow-x:auto;flex:1 1 auto;min-width:0;scrollbar-width:none}
.fases::-webkit-scrollbar{display:none}
.fase{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 14px;border-radius:12px;border:2px solid transparent;
  background:transparent;cursor:pointer;white-space:nowrap;font-weight:700;color:var(--muted)}
.fase i{font:16px/1 var(--f-disp);font-style:normal;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--chip);color:var(--ink)}
.fase[aria-current="page"]{color:var(--ink);border-color:var(--ink)}
.fase[aria-current="page"] i{background:var(--accent);color:var(--accent-ink)}
.fase:disabled{opacity:.45;cursor:not-allowed}
.tbtn{white-space:nowrap;flex:0 0 auto;min-height:48px;min-width:48px;border-radius:12px;border:2px solid var(--line);background:var(--panel);cursor:pointer;font-weight:700;padding:0 12px;display:flex;align-items:center;gap:6px}
.tbtn[data-on="1"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
/* vistas */
.vista{min-height:0;overflow:auto;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:20px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font:clamp(30px,4.2vw,46px)/1.05 var(--f-disp)}
h2{font:26px/1.15 var(--f-disp)}
h3{font-size:20px}
.lead{font-size:20px;color:var(--muted);max-width:62ch;margin:0}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}
.alerta{background:var(--warn-bg);border:3px solid var(--warn);border-radius:18px;padding:18px 20px;display:flex;gap:18px;align-items:center}
.alerta .big{font:64px/0.9 var(--f-disp);color:var(--warn);flex:0 0 auto}
.alerta p{margin:0;font-size:20px}
.alerta b{font-size:24px;display:block}
.pasos5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.p5{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:6px;align-content:start;min-width:0}
.p5 .n{font:44px/1 var(--f-disp)}
.p5 .t{font-weight:700;font-size:19px}
.p5 .d{color:var(--muted);font-size:16px}
.p5 .dato{font:600 22px/1.1 var(--f-mono);color:var(--callout-ink);background:var(--callout);border-radius:8px;padding:4px 8px;justify-self:start}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.lista{margin:0;padding-left:1.1em;display:grid;gap:6px}
.fuente{font-size:14px;color:var(--muted)}
.cta{min-height:60px;padding:0 26px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font:20px/1 var(--f-disp);cursor:pointer;justify-self:start}
.cta:disabled{opacity:.4;cursor:not-allowed}
.sec{min-height:52px;padding:0 18px;border-radius:12px;border:2px solid var(--line);background:var(--panel);font-weight:700;cursor:pointer}
/* bolsas */
.bolsas{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.bolsa{position:relative;text-align:left;border:3px solid var(--line);background:var(--panel);border-radius:18px;padding:12px 12px 14px;cursor:pointer;display:grid;gap:6px;min-height:150px;align-content:start}
.bolsa[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px var(--accent) inset}
.bolsa .num{display:flex;align-items:center;gap:10px;padding-right:34px}
.bolsa .cont{font-size:15px;color:var(--muted);font-family:var(--f-mono)}
.bolsa .meta{font-size:15px}
.barra{height:8px;border-radius:99px;background:var(--chip);overflow:hidden}
.barra>span{display:block;height:100%;background:var(--ok);width:0}
.check{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700}
.bolsa[aria-pressed="true"] .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.inv{display:grid;gap:14px}
.invb h3{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.tabla{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.q{font:22px/1 var(--f-disp);white-space:nowrap}
td.r{font-family:var(--f-mono);font-size:15px}
.mini{display:block}
/* paso */
.pasoV{min-height:0;display:grid;grid-template-columns:minmax(340px,430px) 1fr}
.panel{min-height:0;overflow:auto;background:var(--panel);border-right:1px solid var(--line);
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:grid;gap:14px;align-content:start}
.pcab{display:flex;align-items:flex-start;gap:14px}
.npaso{font:96px/0.82 var(--f-disp);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ptit{display:grid;gap:4px;padding-top:4px;min-width:0}
.ptit h2{font-size:24px}
.grupo{font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.callout{background:var(--callout);color:var(--callout-ink);border-radius:14px;padding:12px;display:grid;gap:8px}
.callout .fila{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.callout .q{font:26px/1 var(--f-disp);min-width:2.2em}
.rots{display:flex;flex-wrap:wrap;gap:6px}
.rot{font:600 15px/1 var(--f-mono);background:var(--panel);color:var(--ink);border-radius:7px;padding:6px 7px;border:1px solid var(--line);display:inline-flex;gap:6px;align-items:center}
.rot .bb{font:12px/1 var(--f-disp);background:var(--ink);color:var(--panel);border-radius:5px;padding:3px 5px}
.subbox{background:var(--sub);color:var(--sub-ink);border-radius:14px;padding:12px;display:grid;gap:10px}
.item{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.item .mi{display:flex;gap:4px}
.res{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 10px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;text-align:left;width:100%}
.res .bx{width:28px;height:28px;flex:0 0 28px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;font-weight:700}
.res[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-bg)}
.res[aria-pressed="true"] .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.badgeAB{font:13px/1 var(--f-disp);width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;border:2px solid var(--ink)}
.badgeAB.A{background:#fff;color:#132033}
.badgeAB.B{background:#132033;color:#fff;border-color:#132033}
.micro{display:grid;gap:6px;counter-reset:m}
.mrow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:12px;background:var(--chip)}
.mrow .mn{font:20px/1 var(--f-disp);width:34px;height:34px;border-radius:10px;background:var(--panel);display:grid;place-items:center;border:2px solid var(--line)}
.mrow .mt{font-weight:700}
.mrow .md{font-size:15px;color:var(--muted)}
.tmr{min-height:44px;border-radius:10px;border:2px solid var(--ink);background:var(--panel);font:600 16px/1 var(--f-mono);padding:0 10px;cursor:pointer;white-space:nowrap}
.tmr[data-run="1"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.nota{font-size:16px;border-left:4px solid var(--accent);padding:4px 0 4px 10px;margin:0}
.max2{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--warn);font-size:15px}
.sug{background:var(--ok-bg);border:2px solid var(--ok);border-radius:12px;padding:10px;display:grid;gap:8px}
.sug button{justify-self:start}
.hecho{min-height:56px;font-weight:700}
.vis{position:relative;min-height:0;background:var(--view);overflow:hidden;touch-action:none}
.vis canvas{display:block;width:100%;height:100%}
.ovl{position:absolute;display:flex;gap:8px;align-items:center}
.ovl.tl{top:12px;left:12px}
.ovl.tr{top:12px;right:max(12px,env(safe-area-inset-right,0px));flex-direction:column}
.ovl.bl{bottom:12px;left:12px;flex-wrap:wrap;max-width:calc(100% - 24px)}
.vbtn{width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;font-weight:700;font-size:22px}
.mult{font:42px/1 var(--f-disp);background:var(--sub);color:var(--sub-ink);border-radius:14px;padding:8px 12px}
.giro{width:64px;height:64px;border-radius:16px;background:#E3F4FF;border:3px solid #22A8E8;display:grid;place-items:center}
.leyenda{display:flex;flex-wrap:wrap;gap:6px;background:color-mix(in srgb,var(--panel) 88%,transparent);border-radius:12px;padding:6px 8px;font-size:13px}
.leyenda span{display:inline-flex;align-items:center;gap:5px}
.leyenda i{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid rgba(0,0,0,.25)}
.cargando{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-weight:700}
/* barra inferior */
.navb{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--panel);border-top:1px solid var(--line);
  padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nb{min-height:60px;min-width:150px;border-radius:14px;border:0;font:20px/1 var(--f-disp);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 18px}
.nb.prev{background:var(--chip);color:var(--ink)}
.nb.next{background:var(--accent);color:var(--accent-ink)}
.nb:disabled{opacity:.35;cursor:not-allowed}
.prog{display:grid;gap:6px;min-width:0}
.prog .txt{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:16px;min-width:0}
.prog .txt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog select{width:100%;min-width:0;min-height:40px;border-radius:10px;border:2px solid var(--line);background:var(--panel);font:inherit;font-size:15px;max-width:100%}
.pbar{height:12px;border-radius:99px;background:var(--chip);overflow:hidden;position:relative}
.pbar>span{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:99px}
.pbar>b{position:absolute;inset:0 auto 0 0;background:var(--ok);opacity:.55}
/* temporizadores */
.tray{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(124px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:20;width:min(340px,calc(100vw - 24px))}
.tcard{background:var(--panel);border:2px solid var(--ink);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;box-shadow:var(--shadow)}
.tcard .tt{font-weight:700;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcard .tv{font:600 26px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.tcard .ts{font-size:14px;color:var(--muted);grid-column:1/-1}
.tcard[data-fin="1"]{border-color:var(--ok);background:var(--ok-bg)}
.tcard button{grid-row:1/3;grid-column:2;align-self:center;border:0;background:var(--chip);border-radius:10px;min-width:44px;min-height:44px;cursor:pointer;font-weight:700}
.tcard .tbar{grid-column:1/-1;height:6px;border-radius:99px;background:var(--chip);overflow:hidden}
.tcard .tbar span{display:block;height:100%;background:var(--accent)}
.vacio{display:grid;gap:12px;justify-items:start}
@media (max-width:1000px){
  .pasos5{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .pasoV{grid-template-columns:1fr;grid-template-rows:auto auto}
  .vis{height:52vh;min-height:300px;order:-1}
  .panel{border-right:0;border-top:1px solid var(--line);padding-right:max(16px,env(safe-area-inset-right,0px))}
  .navb{position:sticky;bottom:0;z-index:5}
  .grid2{grid-template-columns:1fr}
  .npaso{font-size:72px}
  .brand small{display:none}
}
@media (max-width:560px){
  .pasos5{grid-template-columns:1fr}
  .nb{min-width:0;font-size:16px;padding:0 12px}
  .nb .lbl{display:none}
  .alerta{flex-direction:column;align-items:flex-start}
  .fase span{display:none}
  .fase{padding:0 8px}
  .brand b{font-size:18px}
  .top{gap:8px}
  #bSonido .lbl{display:none}
  .navb{gap:8px}
  .nb{min-height:56px;min-width:56px}
  .prog .txt{font-size:14px}
  #pHecho{display:none}
  .bolsas{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bolsa .num{gap:8px;padding-right:28px}
  .bolsa .num svg{width:34px;height:38px}
  .bolsa .num div div:first-child{font-size:17px!important}
  .bolsa .meta,.bolsa .cont{font-size:14px}
}
@media (max-width:900px){ #bSonido .lbl{display:none} }
/* 5 · modelo: puente completo + ficha de la pieza */
.modeloV{position:relative;min-height:0;display:grid;grid-template-columns:minmax(300px,350px) 1fr}
.resumen{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;margin:0}
.resumen div{display:grid;gap:1px;min-width:0}
.resumen dt{font-size:13px;color:var(--muted)}
.resumen dd{margin:0;font:600 16px/1.25 var(--f-mono)}
.buscar{width:100%;box-sizing:border-box;min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:17px;padding:0 12px}
.lbl2{display:grid;gap:6px;font-weight:700;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipf{min-height:40px;border-radius:999px;border:2px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;gap:6px;padding:0 11px;font-weight:700;font-size:14px;cursor:pointer}
.chipf i{width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.25);flex:0 0 12px}
.chipf[aria-pressed="false"]{opacity:.5;text-decoration:line-through;border-style:dashed}
.rango{display:grid;grid-template-columns:auto 1fr 3.4em;gap:10px;align-items:center;font-weight:700;font-size:15px}
.rango input{width:100%;min-height:40px;accent-color:#FFC20E;margin:0}
.rango b{font:600 15px/1 var(--f-mono);text-align:right}
.lpz{display:grid;gap:4px}
.lpz h4{margin:10px 0 2px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pz{display:flex;align-items:center;gap:8px;min-height:44px;width:100%;text-align:left;border:2px solid transparent;border-radius:10px;background:var(--chip);padding:4px 8px;cursor:pointer;font-size:15px}
.pz[aria-current="true"]{border-color:var(--ink);background:var(--accent);color:var(--accent-ink)}
.pz .dot{width:12px;height:12px;border-radius:3px;flex:0 0 12px;border:1px solid rgba(0,0,0,.25)}
.pz .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pz .bb{margin-left:auto;font:12px/1 var(--f-disp);background:var(--ink);color:var(--panel);border-radius:5px;padding:3px 5px;flex:0 0 auto}

function mix(hex, t, base){ base = base || "#ffffff"; const a = parseInt(hex.slice(1), 16), b = parseInt(base.slice(1), 16);
  const c = [16, 8, 0].map(s => Math.round(((a >> s) & 255) * (1 - t) + ((b >> s) & 255) * t)); return "#" + c.map(v => v.toString(16).padStart(2, "0")).join(""); }
function miniHoja(h, maxW, maxH){
  const xs = h.o.map(p => p[0]), ys = h.o.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const w = x1 - x0, hh = y1 - y0; const rot = hh > w * 1.4;   // las tiras se acuestan
  const W = rot ? hh : w, Hh = rot ? w : hh;
  const s = Math.min(maxW / W, maxH / Hh);
  const svg = sv("svg", {width: Math.max(8, W * s).toFixed(1), height: Math.max(8, Hh * s).toFixed(1), viewBox: `0 0 ${W} ${Hh}`, class: "mini", role: "img", "aria-label": h.rot});
  const g = sv("g", {transform: rot ? `translate(0 ${Hh}) rotate(-90) translate(${-x0} ${-y0})` : `translate(${-x0} ${Hh + y0}) scale(1 -1)`});
  const col = FAMC[h.fam];
  g.append(sv("polygon", {points: h.o.map(p => p.join(",")).join(" "), fill: mix(col, .62), stroke: col, "stroke-width": Math.max(.4, 1.2 / s), "vector-effect": "non-scaling-stroke"}));
  const ln = (arr, c, wd, dash) => arr.forEach(L => g.append(sv("polyline", {points: L.map(p => p.join(",")).join(" "), fill: "none", stroke: c, "stroke-width": wd, "vector-effect": "non-scaling-stroke", "stroke-dasharray": dash || ""})));
  ln(h.pl, "#1e8f3a", 1, "3 2"); ln(h.ej, "#0aa6c2", 1); ln(h.tx, "#1636a8", 1);
  svg.append(g); return svg;
}

let actx = null;
function beep(){
  if (!S.sonido) return;
  try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    [0, .28, .56].forEach((d, i) => { const o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = i === 2 ? 1046 : 784; g.gain.setValueAtTime(.0001, t + d);
      g.gain.exponentialRampToValueAtTime(.25, t + d + .02); g.gain.exponentialRampToValueAtTime(.0001, t + d + .22);
      o.connect(g).connect(actx.destination); o.start(t + d); o.stop(t + d + .25); });
  }catch(e){}
}
function nuevoTimer(tipo, pid, etiqueta){
  try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); }catch(e){}
  const min = tipo === "espera" ? TI.espera_min : TI.secado_min;
  const ya = S.timers.find(t => t.pid === pid && t.tipo === tipo && !t.vencido);
  if (ya){ S.timers = S.timers.filter(t => t !== ya); guardar(); pintarTimers(); render(); return; }
  S.timers.push({id: Date.now() + Math.random(), tipo, pid, et: etiqueta, ini: Date.now(), fin: Date.now() + min * 60000, vent: tipo === "espera" ? Date.now() + TI.ventana_max_min * 60000 : 0});
  guardar(); pintarTimers(); render();
}
function mmss(ms){ ms = Math.max(0, ms); const s = Math.ceil(ms / 1000); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }
const tray = document.getElementById("tray");
function pintarTimers(){
  tray.textContent = "";
  const now = Date.now();
  S.timers.forEach(t => {
    const fin = now >= t.fin;
    if (fin && !t.sonado){ t.sonado = true; guardar(); beep(); }
    if (t.tipo === "espera" && t.vent && now > t.vent + 5 * 60000){ return; }
    const dur = t.fin - t.ini, pr = Math.min(1, (now - t.ini) / dur);
    let tv, ts;
    if (t.tipo === "espera"){ tv = fin ? mmss(t.vent - now) : mmss(t.fin - now);
      ts = fin ? (now < t.vent ? "Ya se puede unir. Quedan para los 40 min:" : "Pasaron 40 min: volver a engomar.") : "Esperar antes de unir"; }
    else { tv = fin ? "listo" : mmss(t.fin - now); ts = fin ? "Seco: se puede seguir con la siguiente capa" : "Secando · 20 min"; }
    const c = el("div", {class: "tcard", "data-fin": fin ? "1" : "0"},
      el("div", {class: "tt"}, t.et), el("div", {class: "tv"}, tv),
      el("button", {"aria-label": "Quitar temporizador", onclick: () => { S.timers = S.timers.filter(x => x !== t); guardar(); pintarTimers(); render(); }}, "✕"),
      el("div", {class: "ts"}, ts), el("div", {class: "tbar"}, el("span", {style: `width:${(pr * 100).toFixed(1)}%`})));
    tray.append(c);
  });
}
setInterval(() => { if (S.timers.length) pintarTimers(); }, 1000);

const MODELO = PZ.meta.modelo;

function fmtN(v, n){ n = n === undefined ? 1 : n; let s = Math.abs(v).toFixed(n); if (s.indexOf(".") >= 0) s = s.replace(/0+$/, "").replace(/\.$/, "");
  let [e, d] = s.split("."); e = e.replace(/\B(?=(\d{3})+(?!\d))/g, " "); return (v < 0 && +s ? "−" : "") + e + (d ? "," + d : ""); }

const PAJAR = {}, FICHAS_T = {};
PZ.subensambles.forEach(s => { PAJAR[s.id] = normTxt([s.nom, s.id, s.m, FAMLARGA[s.fam] || "", s.ficha.desc, ...s.hojas.map(h => HOJA[h].rot)].join(" "));

function buscar(q){
  q = normTxt(q); let bolsa = null;
  q = q.replace(/bolsa\s*(\d+)/, (_, n) => { bolsa = +n; return " "; });
  const t = q.split(/\s+/).filter(Boolean);
  const base = PZ.subensambles.filter(s => enFiltro(s) && (bolsa === null || s.bolsa === bolsa));
  if (!t.length) return base;
  const exactas = base.filter(s => t.every(w => FICHAS_T[s.id].has(w)));
  return exactas.length ? exactas : base.filter(s => t.every(w => PAJAR[s.id].includes(w)));

/* vista explotada: cada armadura se separa; caras interiores hacia el centro y exteriores hacia afuera; techo hacia arriba */
function offExpl(s, u){
  const o = [0, 0, 0]; if (!u) return o;
  const sg = s.arm === "A" ? 1 : s.arm === "B" ? -1 : 0;
  if (sg){
    o[2] += sg * 70 * u;
    const hacia = s.cara === "int" ? -1 : s.cara === "ext" ? 1 : 0;
    const k = (s.fam === "GI" || s.fam === "GS") ? 24 : s.fam === "CI" ? 15 - 3.5 * s.tramo.capa : s.fam === "DWB" ? 9 : 0;
    o[2] += sg * hacia * k * u;

  else { let ult = null, og; L.forEach((q, j) => { if (q.grupo !== ult){ og = el("optgroup", {label: q.grupo}); sel.append(og); ult = q.grupo; } og.append(el("option", {value: j}, `${q.n}. ${q.tit}`)); }); }
  sel.value = String(i);
  vistaActual = v;
  if (cambio || !V.escenaDe || V.escenaDe !== v + "|" + p.id) dibujarEscena();
}
function dibujarEscena(){
  if (!V.ok || !V.renderer) return;
  const L = listaPasos(), i = Math.min(idx(), L.length - 1), p = L[i];
  ajustar();
  const t0 = performance.now();
  if (S.vista === "pegar") escenaPegar(p); else escenaMontar(i);
  V.escenaDe = S.vista + "|" + p.id; V.ultimaEscenaMs = performance.now() - t0;
  document.documentElement.dataset.escena = V.escenaDe;
}
document.getElementById("bPrev").addEventListener("click", () => setIdx(idx() - 1));
document.getElementById("bNext").addEventListener("click", () => setIdx(idx() + 1));
document.getElementById("pSalto").addEventListener("change", e => setIdx(+e.target.value));
document.addEventListener("keydown", e => {
  if (S.vista === "modelo" && e.key === "Escape" && MD.sel){ e.preventDefault(); seleccionar(null); return; }
  if (!(S.vista === "pegar" || S.vista === "montar") || e.target.closest("select,input,textarea")) return;
  if (e.key === "ArrowRight"){ e.preventDefault(); setIdx(idx() + 1); }
  if (e.key === "ArrowLeft"){ e.preventDefault(); setIdx(idx() - 1); }
});
if (typeof ResizeObserver !== "undefined") new ResizeObserver(() => ajustar()).observe(document.getElementById("main"));
pintarTimers();
render(true);
